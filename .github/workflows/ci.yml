name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly: suite completa, cobertura con umbrales y E2E completo en shards.
  # En los eventos que no son PR el clasificador siempre fuerza `total`.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Solo se cancelan PRs: un push nuevo no debe abortar el nightly ni la
  # validación de `main`.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Plan de pruebas proporcional al cambio.
# El clasificador (scripts/ci/clasificar-cambios.mjs) decide qué capas se ejecutan.
# Regla: ante cualquier duda escala a suite completa; nunca omite por ignorancia.
jobs:
  clasificar:
    name: Plan de pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      nivel: ${{ steps.plan.outputs.nivel }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      unitarias_modo: ${{ steps.plan.outputs.unitarias_modo }}
      unitarias_archivos: ${{ steps.plan.outputs.unitarias_archivos }}
      integracion_modo: ${{ steps.plan.outputs.integracion_modo }}
      integracion_archivos: ${{ steps.plan.outputs.integracion_archivos }}
      concurrencia: ${{ steps.plan.outputs.concurrencia }}
      pgtap: ${{ steps.plan.outputs.pgtap }}
      e2e_modo: ${{ steps.plan.outputs.e2e_modo }}
      e2e_specs: ${{ steps.plan.outputs.e2e_specs }}
      e2e_total_shards: ${{ steps.plan.outputs.e2e_total_shards }}
      e2e_shard_list: ${{ steps.plan.outputs.e2e_shard_list }}
    steps:
      # Historial completo: `vitest --changed`, `git diff base...HEAD` y el
      # clasificador necesitan el merge-base. El paquete del repo pesa ~11 MB.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Calcular plan
        id: plan
        shell: bash
        env:
          EVENTO: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          comun=(--github-output "$GITHUB_OUTPUT" --resumen "$GITHUB_STEP_SUMMARY")
          if [ "$EVENTO" = "pull_request" ]; then
            node scripts/ci/clasificar-cambios.mjs --base "$BASE_SHA" "${comun[@]}"
          else
            # push a main y ejecuciones manuales: suite completa siempre.
            node scripts/ci/clasificar-cambios.mjs --forzar-total "${comun[@]}"
          fi

  verificacion:
    name: Tipos, lint y unitarias
    needs: clasificar
    if: needs.clasificar.outputs.typecheck == 'true' || needs.clasificar.outputs.unitarias_modo != 'ninguna'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # En paralelo: son independientes y cada uno cuesta ~30 s.
      - name: Tipos y lint
        shell: bash
        run: |
          ( pnpm typecheck > tsc.log 2>&1 ) & tsc_pid=$!
          ( pnpm lint > lint.log 2>&1 ) & lint_pid=$!
          estado=0
          if ! wait "$tsc_pid"; then
            echo "::error::pnpm typecheck falló"
            tail -n 80 tsc.log
            estado=1
          fi
          if ! wait "$lint_pid"; then
            echo "::error::pnpm lint falló"
            tail -n 80 lint.log
            estado=1
          fi
          exit "$estado"

      # La cobertura solo se mide con la suite completa o con el diff
      # (`cambiadas`), donde Vitest limita `coverage.changed` al diff. Los
      # umbrales solo se exigen en la suite completa: aplicarlos a una corrida
      # parcial daría falsos rojos por código legado no tocado.
      - name: Pruebas unitarias
        if: needs.clasificar.outputs.unitarias_modo != 'ninguna'
        shell: bash
        env:
          MODO: ${{ needs.clasificar.outputs.unitarias_modo }}
          ARCHIVOS: ${{ needs.clasificar.outputs.unitarias_archivos }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          COBERTURA_UMBRAL: ${{ needs.clasificar.outputs.unitarias_modo == 'completas' && 'estricto' || '' }}
        run: |
          argumentos=(
            --modo "$MODO"
            --base "${BASE_SHA:-origin/main}"
            --archivos "$ARCHIVOS"
          )
          if [ "$MODO" = "completas" ] || [ "$MODO" = "cambiadas" ]; then
            argumentos+=(--cobertura)
          fi
          node scripts/ci/ejecutar-unitarias.mjs "${argumentos[@]}"

      - name: Resumen de cobertura
        if: >-
          needs.clasificar.outputs.unitarias_modo == 'completas' ||
          needs.clasificar.outputs.unitarias_modo == 'cambiadas'
        shell: bash
        run: node scripts/ci/resumen-cobertura.mjs --salida "$GITHUB_STEP_SUMMARY" --exigir

      - name: Subir informe de cobertura
        if: >-
          needs.clasificar.outputs.unitarias_modo == 'completas' ||
          needs.clasificar.outputs.unitarias_modo == 'cambiadas'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: cobertura/
          if-no-files-found: error
          retention-days: 7

  base_datos:
    name: pgTAP, integración y concurrencia
    needs: clasificar
    if: >-
      needs.clasificar.outputs.pgtap == 'true' ||
      needs.clasificar.outputs.integracion_modo != 'no' ||
      needs.clasificar.outputs.concurrencia == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/preparar-supabase

      - name: pgTAP (permisos SQL tras todas las migraciones)
        if: needs.clasificar.outputs.pgtap == 'true'
        run: supabase test db

      - name: Integración contra Supabase local
        if: needs.clasificar.outputs.integracion_modo != 'no'
        shell: bash
        env:
          MODO: ${{ needs.clasificar.outputs.integracion_modo }}
          ARCHIVOS: ${{ needs.clasificar.outputs.integracion_archivos }}
        run: |
          if [ "$MODO" = "archivos" ]; then
            node tests/integracion/validar-entorno.mjs
            read -r -a lista <<< "$ARCHIVOS"
            pnpm exec vitest run --no-file-parallelism "${lista[@]}"
          else
            pnpm test:integracion
          fi

      - name: Concurrencia estricta (dos conexiones)
        if: needs.clasificar.outputs.concurrencia == 'true'
        run: pnpm test:concurrencia

      - name: Registrar logs de Supabase si algo falla
        if: failure()
        run: docker ps --format '{{.Names}}' && supabase status

  e2e:
    # Un shard por runner, cada uno con su propio stack de Supabase: el
    # aislamiento es total. La lista sale del plan (1 shard en modo focal,
    # 4 en suite completa) y nunca está vacía aunque el job se salte.
    name: E2E de navegador (${{ matrix.shard }}/${{ needs.clasificar.outputs.e2e_total_shards }})
    needs: clasificar
    if: needs.clasificar.outputs.e2e_modo != 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.clasificar.outputs.e2e_shard_list) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/preparar-supabase

      - name: Provisionar fixture E2E
        run: |
          node supabase/semillas/e2e-local.mjs /tmp/e2e-fixture.json --exports > /tmp/e2e-exports.txt
          cat /tmp/e2e-exports.txt >> "$GITHUB_ENV"

      - name: Cachear navegador de Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E de navegador (incluye OCR con stub local)
        shell: bash
        env:
          MODO: ${{ needs.clasificar.outputs.e2e_modo }}
          SPECS: ${{ needs.clasificar.outputs.e2e_specs }}
          SHARD: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ needs.clasificar.outputs.e2e_total_shards }}
        run: |
          # Casi todos los specs hacen `test.skip` si este flag no vale 'si'.
          # Sin esta guarda, un cambio en la acción dejaría la suite en verde
          # sin ejecutar una sola prueba.
          if [ "${E2E_HABILITAR_PRUEBAS_REMOTAS:-}" != "si" ]; then
            echo "::error::E2E_HABILITAR_PRUEBAS_REMOTAS no vale 'si'; la suite se saltaría entera."
            exit 1
          fi

          argumentos=()
          if [ "$MODO" = "specs" ]; then
            for spec in $SPECS; do argumentos+=("$spec"); done
            echo "Ejecutando ${#argumentos[@]} specs focalizados."
          else
            echo "Ejecutando la suite E2E completa."
          fi

          export PLAYWRIGHT_JSON_OUTPUT_NAME=/tmp/e2e-resultados.json
          export PLAYWRIGHT_HTML_OPEN=never
          pnpm exec playwright test --reporter=list,json,html \
            --shard="$SHARD/$TOTAL_SHARDS" "${argumentos[@]}"

          # Un run donde todo quedó 'skipped' es un falso verde: se verifica
          # que al menos una prueba se haya ejecutado de verdad.
          node -e '
            const fs = require("fs");
            const informe = JSON.parse(fs.readFileSync("/tmp/e2e-resultados.json", "utf8"));
            let ejecutadas = 0;
            let saltadas = 0;
            (function recorrer(suite) {
              for (const spec of suite.specs || []) {
                for (const prueba of spec.tests || []) {
                  if (prueba.status === "skipped") saltadas += 1;
                  else ejecutadas += 1;
                }
              }
              for (const hija of suite.suites || []) recorrer(hija);
            })(informe);
            console.log(`E2E shard ${process.env.SHARD}/${process.env.TOTAL_SHARDS} · ejecutadas: ${ejecutadas} · saltadas: ${saltadas}`);
            if (ejecutadas === 0) {
              console.error("::error::Este shard E2E no ejecutó ninguna prueba (todas saltadas).");
              process.exit(1);
            }
          '

      - name: Registrar logs de Supabase si algo falla
        if: failure()
        run: docker ps --format '{{.Names}}' && supabase status

      - name: Subir artefactos de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-shard-${{ matrix.shard }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 1

  # Job agregado para que la protección de rama tenga UN check estable.
  # No basta con aceptar "skipped": se contrasta cada capa omitida contra el
  # plan de pruebas. Si un `if` se rompe y salta una capa que el plan exigía,
  # este job falla en vez de dejar el run en verde sin haber probado nada.
  resultado:
    name: Resultado de pruebas
    needs: [clasificar, verificacion, base_datos, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluar resultado
        shell: bash
        env:
          CLASIFICAR: ${{ needs.clasificar.result }}
          VERIFICACION: ${{ needs.verificacion.result }}
          BASE_DATOS: ${{ needs.base_datos.result }}
          E2E: ${{ needs.e2e.result }}
          TYPECHECK: ${{ needs.clasificar.outputs.typecheck }}
          UNITARIAS_MODO: ${{ needs.clasificar.outputs.unitarias_modo }}
          INTEGRACION_MODO: ${{ needs.clasificar.outputs.integracion_modo }}
          CONCURRENCIA: ${{ needs.clasificar.outputs.concurrencia }}
          PGTAP: ${{ needs.clasificar.outputs.pgtap }}
          E2E_MODO: ${{ needs.clasificar.outputs.e2e_modo }}
        run: |
          echo "clasificar=$CLASIFICAR verificacion=$VERIFICACION base_datos=$BASE_DATOS e2e=$E2E"
          echo "typecheck=$TYPECHECK unitarias=$UNITARIAS_MODO integracion=$INTEGRACION_MODO concurrencia=$CONCURRENCIA pgtap=$PGTAP e2e=$E2E_MODO"

          fallo=0

          exigir() {
            local capa="$1" resultado="$2" requerida="$3"
            if [ "$requerida" = "true" ]; then
              if [ "$resultado" != "success" ]; then
                echo "::error::La capa '$capa' era obligatoria según el plan y terminó en '$resultado'."
                fallo=1
              fi
            else
              case "$resultado" in
                success|skipped) ;;
                *)
                  echo "::error::La capa '$capa' no terminó en verde ('$resultado')."
                  fallo=1
                  ;;
              esac
            fi
          }

          verificacion_requerida=false
          if [ "$TYPECHECK" = "true" ] || [ "$UNITARIAS_MODO" != "ninguna" ]; then
            verificacion_requerida=true
          fi

          base_datos_requerida=false
          if [ "$PGTAP" = "true" ] || [ "$INTEGRACION_MODO" != "no" ] || [ "$CONCURRENCIA" = "true" ]; then
            base_datos_requerida=true
          fi

          e2e_requerido=false
          if [ "$E2E_MODO" != "no" ]; then
            e2e_requerido=true
          fi

          exigir "clasificar" "$CLASIFICAR" true
          exigir "verificacion" "$VERIFICACION" "$verificacion_requerida"
          exigir "base_datos" "$BASE_DATOS" "$base_datos_requerida"
          exigir "e2e" "$E2E" "$e2e_requerido"

          if [ "$fallo" != "0" ]; then
            exit 1
          fi
          echo "Todas las capas exigidas por el plan quedaron en verde."
